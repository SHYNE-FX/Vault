<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vault — Offline</title>
<meta name="theme-color" content="#3a58db" />
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#f6f6fb; color:#1a1b2b; text-align:center; padding:24px; }
  .box { max-width:360px; }
  h1 { font-size:20px; margin:16px 0 8px; }
  p { font-size:14px; color:#5a5b72; line-height:1.5; }
  button { margin-top:20px; padding:10px 20px; border:none; border-radius:8px;
    background:#3a58db; color:#fff; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>Vault couldn't load this page and nothing is cached yet. Reconnect and reopen the app once to enable full offline use.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
